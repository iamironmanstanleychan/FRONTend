<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>開始前先讀</title><style>:root{color-scheme:light}*{box-sizing:border-box}body{font:18px/1.85 -apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;color:#17352f;background:#f3f5ef;margin:0}main{max-width:980px;margin:2rem auto;padding:2.5rem 3rem;background:#fffdf6;border-top:6px solid #ab3e27}h1{font-size:32px;line-height:1.45}h2{font-size:27px;margin-top:2.5rem;border-top:1px solid #b8c8bc;padding-top:1.2rem}h3{font-size:22px}a{color:#96371f;overflow-wrap:anywhere}p,li,td{overflow-wrap:anywhere}pre{font:15px/1.65 ui-monospace,monospace;background:#edf2ec;border-left:3px solid #7a9989;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%;font-size:16px}th,td{border:1px solid #b8c8bc;padding:10px;text-align:left;vertical-align:top}th{background:#edf2ec}code{font-family:ui-monospace,monospace}nav{margin:1em 0}a:focus-visible{outline:3px solid #ab3e27}details{margin:1rem 0}@media(max-width:700px){main{padding:1.2rem;margin:0}body{font-size:17px}h1{font-size:27px}h2{font-size:23px}table{font-size:14px}}</style></head><body><main><h1>資料表格課堂檔案</h1>
<p>用 VS Code 開啟自己的正式網站根資料夾。閱讀學員筆記，逐段加入內容並保留自己的修改。獨立練習另建資料夾，再依筆記建立 HTML。</p>
<p>外層資料夾可以改名，整包搬移時保留內部相對位置。</p>
</main></body></html>
